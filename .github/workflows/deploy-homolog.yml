name: Deploy Homologação (AWS)

# Homologação = branch dev: build das imagens fiscal-api/fiscal-worker e push
# no GHCR, depois redeploy no servico Docker Compose gerenciado pelo Coolify
# na EC2 da API do Okto ERP (mesma maquina, rede interna do compose).
#
# O deploy NAO usa mais /opt/okto: aquele stack foi desativado na migracao
# para o Coolify em 2026-11-25. O compose ativo vive em
# /data/coolify/services/srbdh93zoi0mikhdr95va5wm e le as imagens das
# variaveis FISCAL_API_IMAGE / FISCAL_WORKER_IMAGE do .env.

on:
  push:
    branches: [dev]
  workflow_dispatch:

concurrency:
  group: deploy-homolog-aws
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ghcr.io/${{ github.repository_owner }}/fiscalapi
  # Diretorio do servico Docker Compose gerenciado pelo Coolify na EC2
  COOLIFY_SERVICE_DIR: /data/coolify/services/srbdh93zoi0mikhdr95va5wm

jobs:
  build:
    name: Build e push das imagens
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - target: api-final
            image: fiscal-api
          - target: worker-final
            image: fiscal-worker
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Login no GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build e push (${{ matrix.image }})
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          target: ${{ matrix.target }}
          push: true
          # Tag mutavel (:dev) para compatibilidade + tag imutavel (:sha-<commit>)
          # para rastreabilidade e rollback do que esta no ar.
          tags: |
            ${{ env.IMAGE_PREFIX }}/${{ matrix.image }}:dev
            ${{ env.IMAGE_PREFIX }}/${{ matrix.image }}:sha-${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,scope=${{ matrix.image }},mode=max

  deploy:
    name: Deploy na EC2
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy via docker compose no servico do Coolify
        uses: appleboy/ssh-action@v1
        env:
          GHCR_USER: ${{ secrets.GHCR_USER }}
          GHCR_TOKEN: ${{ secrets.GHCR_TOKEN }}
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          command_timeout: 20m
          envs: GHCR_USER,GHCR_TOKEN
          script: |
            set -euo pipefail
            DIR="${{ env.COOLIFY_SERVICE_DIR }}"
            PREFIX="${{ env.IMAGE_PREFIX }}"
            SHA="${{ github.sha }}"

            cd "$DIR"

            if [ ! -f .env ]; then
              echo "ERRO: .env nao existe em $DIR"
              exit 1
            fi

            # Backup do .env antes de mexer (rollback rapido). Mantem os 5 ultimos.
            sudo cp .env ".env.bak-$(date +%Y%m%d-%H%M%S)"
            sudo sh -c 'ls -1t .env.bak-* 2>/dev/null | tail -n +6 | xargs -r rm -f'

            # Troca as duas tags (o compose usa ${FISCAL_API_IMAGE}/${FISCAL_WORKER_IMAGE})
            sudo sed -i "s|^FISCAL_API_IMAGE=.*|FISCAL_API_IMAGE=\"${PREFIX}/fiscal-api:sha-${SHA}\"|" .env
            sudo sed -i "s|^FISCAL_WORKER_IMAGE=.*|FISCAL_WORKER_IMAGE=\"${PREFIX}/fiscal-worker:sha-${SHA}\"|" .env
            echo "=== imagens ==="
            sudo grep -E '^FISCAL_(API|WORKER)_IMAGE=' .env

            # O pacote no GHCR e publico, mas manter o login evita rate limit e
            # cobre o caso de o pacote virar privado.
            if [ -n "${GHCR_TOKEN:-}" ]; then
              printf '%s' "$GHCR_TOKEN" | sudo docker login ghcr.io -u "$GHCR_USER" --password-stdin
            fi

            echo "=== pull ==="
            sudo docker compose --env-file .env pull fiscal-api fiscal-worker 2>&1 | tail -6

            echo "=== up ==="
            sudo docker compose --env-file .env up -d --no-deps fiscal-api fiscal-worker 2>&1 | tail -10

            echo "=== aguardando health ==="
            for i in $(seq 1 24); do
              STATUS=$(sudo docker inspect -f '{{.State.Health.Status}}' fiscal-api-srbdh93zoi0mikhdr95va5wm 2>/dev/null || echo unknown)
              if [ "$STATUS" = "healthy" ]; then
                echo "fiscal-api healthy"
                break
              fi
              if [ "$i" -eq 24 ]; then
                echo "ERRO: fiscal-api nao ficou healthy (status: $STATUS)"
                sudo docker compose --env-file .env logs --tail=60 fiscal-api
                exit 1
              fi
              sleep 5
            done

            sudo docker image prune -af >/dev/null 2>&1 || true

            echo "=== status ==="
            sudo docker ps --format '{{.Names}}\t{{.Status}}' | grep fiscal || true

      - name: Smoke test
        run: |
          set -e
          for i in $(seq 1 18); do
            if curl -fsS "https://fiscal.homologacao.oktosistemas.com.br/health/ready" > /dev/null; then
              echo "OK: /health/ready respondeu"
              exit 0
            fi
            echo "aguardando fiscal-api subir ($i/18)..."
            sleep 10
          done
          echo "FAIL: /health/ready nao respondeu apos o deploy"
          exit 1