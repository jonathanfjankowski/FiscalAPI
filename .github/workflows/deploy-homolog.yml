name: Deploy Homologação (AWS)

# Homologação = branch dev: build das imagens fiscal-api/fiscal-worker com a
# tag `dev`, push no GHCR e redeploy na EC2 da API do Okto ERP (mesma máquina,
# rede interna do compose — ver okto_api/deploy/aws/compose.yaml).

on:
  push:
    branches: [dev]
  workflow_dispatch:

concurrency:
  group: deploy-homolog-aws
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ghcr.io/${{ github.repository_owner }}/fiscalapi

jobs:
  build:
    name: Build e push das imagens
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - target: api-final
            image: fiscal-api
          - target: worker-final
            image: fiscal-worker
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Login no GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build e push (${{ matrix.image }})
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          target: ${{ matrix.target }}
          push: true
          tags: ${{ env.IMAGE_PREFIX }}/${{ matrix.image }}:dev
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,scope=${{ matrix.image }},mode=max

  deploy:
    name: Deploy na EC2
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: SSH na EC2 app
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            set -e
            cd /opt/okto
            docker compose pull fiscal-api fiscal-worker
            docker compose up -d fiscal-api fiscal-worker
            docker image prune -f
