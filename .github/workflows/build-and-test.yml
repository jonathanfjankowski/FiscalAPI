name: build-and-test

on:
  pull_request:
  push:
    branches: [main, master]

jobs:
  build:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: fiscal_test
          POSTGRES_USER: fiscal
          POSTGRES_PASSWORD: fiscal
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U fiscal"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: 1
      ConnectionStrings__Postgres: Host=localhost;Database=fiscal_test;Username=fiscal;Password=fiscal

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET 10 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Cache NuGet
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore --configuration Release

      - name: Test
        run: dotnet test --no-build --configuration Release --logger trx --collect-coverage

      - name: Format check
        run: dotnet format --verify-no-changes --no-restore

      - name: Frontend lint (oxlint)
        run: |
          cd frontend
          npm ci
          npm run lint
