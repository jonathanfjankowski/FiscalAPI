services:
  api:
    build:
      context: ..
      dockerfile: docker/Dockerfile
      target: api-final
    ports:
      - "8080:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_URLS=http://+:8080
      - ConnectionStrings__Postgres=Host=postgres;Database=fiscal;Username=fiscal;Password=${DB_PASSWORD:-fiscal}
      - Certificados__ChaveMestraKEK=${KEK_MASTER_KEY}
      - Fiscal__ModoSandbox=${MODO_SANDBOX:-true}
      # Painel admin (seed do primeiro operador + assinatura de JWT).
      # ADMIN_JWT_SECRET sem valor = login do painel fica desabilitado até configurar.
      - ADMIN_EMAIL=${ADMIN_EMAIL:-}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:-}
      - ADMIN_JWT_SECRET=${ADMIN_JWT_SECRET:-}
      # Redis (opcional) — rate limit distribuído + cache compartilhado.
      - Fiscal__Redis__ConnectionString=${REDIS_CONNECTION_STRING:-}
    depends_on:
      postgres:
        condition: service_healthy

  worker:
    build:
      context: ..
      dockerfile: docker/Dockerfile
      target: worker-final
    environment:
      - DOTNET_ENVIRONMENT=Development
      - ConnectionStrings__Postgres=Host=postgres;Database=fiscal;Username=fiscal;Password=${DB_PASSWORD:-fiscal}
      - Certificados__ChaveMestraKEK=${KEK_MASTER_KEY}
    depends_on:
      postgres:
        condition: service_healthy

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  postgres:
    image: postgres:16-alpine
    command:
      - postgres
      - -c
      - wal_level=replica
      - -c
      - archive_mode=on
      - -c
      - archive_command=test ! -f /wal_archive/%f && cp %p /wal_archive/%f
      - -c
      - archive_timeout=300
    environment:
      - POSTGRES_DB=fiscal
      - POSTGRES_USER=fiscal
      - POSTGRES_PASSWORD=${DB_PASSWORD:-fiscal}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - wal_archive:/wal_archive
      - ./postgres-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fiscal -d fiscal"]
      interval: 5s
      timeout: 5s
      retries: 10
    ports:
      - "5432:5432"

volumes:
  pgdata:
  redisdata:
  wal_archive:
